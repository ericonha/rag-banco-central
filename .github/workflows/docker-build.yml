name: Build and Test Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to DockerHub (optional, if pushing to DockerHub)
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t rag-banco-central:latest .

      # Step 5: Run the container to check for errors
      - name: Run container and check for errors
        run: |
          docker run --rm rag-banco-central:latest /bin/sh -c "echo 'Container started successfully'"

      # Step 6: (Optional) Push the Docker image to DockerHub
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag rag-banco-central:latest my-dockerhub-username/rag-banco-central:latest
          docker push my-dockerhub-username/rag-banco-central:latest