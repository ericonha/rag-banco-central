name: Build and publish Docker images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# GITHUB_TOKEN needs packages:write to push to ghcr.io (only used on pushes to main).
permissions:
  contents: read
  packages: write

jobs:
  # Browser tests: real frontend + real FastAPI app + real Postgres; only retrieval and the LLM are
  # replaced (e2e/server.py). Runs in parallel with the image build.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
      E2E_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend
        run: uv sync
        working-directory: backend
      - name: Install frontend
        run: npm install --legacy-peer-deps
        working-directory: frontend
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run end-to-end tests
        run: npx playwright test
        working-directory: e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  build:
    runs-on: ubuntu-latest

    # Real Postgres (with pgvector) for the database tests.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same build settings as docker-compose.yml: the API image needs the repo root as
      # context (it copies backend/ and tests/), the frontend image builds from ./frontend.
      - name: Build API image
        run: docker build -f backend/Dockerfile -t rag-banco-central-api:latest .

      - name: Build frontend image
        run: docker build -t rag-banco-central-frontend:latest ./frontend

      # Importing the app catches missing dependencies and syntax/import errors.
      - name: Smoke test API image
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://user:pass@localhost:5432/db \
            rag-banco-central-api:latest \
            python -c "import app.main; print('API imports OK')"

      # Applies the Alembic migrations to the service database, then runs the whole suite
      # (unit tests plus the database/admin-API tests, which need RUN_DB_TESTS=1).
      - name: Run tests
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
            -e RUN_DB_TESTS=1 \
            rag-banco-central-api:latest \
            sh -c "alembic upgrade head && python -m pytest -q"

      - name: Smoke test frontend image
        run: docker run --rm rag-banco-central-frontend:latest ls dist/index.html

      # Publish only from main; pull requests just build and test.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for name in api frontend; do
            local_image="rag-banco-central-${name}"
            remote_image="ghcr.io/${OWNER}/${local_image}"
            docker tag "${local_image}:latest" "${remote_image}:latest"
            docker tag "${local_image}:latest" "${remote_image}:${{ github.sha }}"
            docker push "${remote_image}:latest"
            docker push "${remote_image}:${{ github.sha }}"
          done
