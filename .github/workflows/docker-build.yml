name: Build Docker images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same build settings as docker-compose.yml: the API image needs the repo root as
      # context (it copies backend/ and tests/), the frontend image builds from ./frontend.
      - name: Build API image
        run: docker build -f backend/Dockerfile -t rag-banco-central-api:latest .

      - name: Build frontend image
        run: docker build -t rag-banco-central-frontend:latest ./frontend

      # Importing the app catches missing dependencies and syntax/import errors.
      - name: Smoke test API image
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://user:pass@localhost:5432/db \
            rag-banco-central-api:latest \
            python -c "import app.main; print('API imports OK')"

      - name: Smoke test frontend image
        run: docker run --rm rag-banco-central-frontend:latest ls dist/index.html
