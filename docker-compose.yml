services:
  # PostgresML image. Its entrypoint (/app/entrypoint.sh) starts Postgres 15 and the
  # dashboard, creates user/password/db "postgresml", enables vector and pgml, then
  # runs `exec "$@"`. With no command it exits, so we give it one to keep it alive.
  db:
    image: ghcr.io/postgresml/postgresml:2.10.0
    restart: unless-stopped
    command: ["sleep", "infinity"]
    ports:
      - "5433:5432"
    volumes:
      - postgresml_data:/var/lib/postgresql

  api:
    build:
      context: .          # project root — lets Dockerfile reach both backend/ and tests/
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    # Dev: edit code on the Mac and have it show up inside the container.
    volumes:
      - ./backend/app:/srv/app
      - ./backend/migrations:/srv/migrations
      - ./check_docs.py:/srv/check_docs.py:ro
      - ./tests:/srv/tests
    command: ["sh", "-c", "until alembic upgrade head; do echo waiting for db; sleep 3; done; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/app"]

  # Daily scrape -> chunk -> embed. Schedule/params come from PIPELINE_* in .env.
  pipeline:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./backend/app:/srv/app
    command: ["python", "-m", "app.worker.scheduler"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api

volumes:
  postgresml_data:
